<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>编辑台 · Shuhan WANG 主页</title>
<style>
  :root { --t:#1c1e21; --m:#5a6270; --a:#0a58ca; --b:#fff; --s:#f6f8fb; --r:#e2e5ea; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--t); background:var(--s); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
  .top { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--r);
    display:flex; align-items:center; gap:10px; padding:10px 18px; }
  .top h1 { font-size:16px; margin:0; }
  .top .status { color:var(--m); font-size:12px; margin-left:auto; }
  .btn { border:none; border-radius:8px; padding:7px 14px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn.primary { background:var(--a); color:#fff; }
  .btn.gray { background:#eef1f5; color:var(--t); }
  .layout { display:flex; gap:14px; padding:14px 18px; align-items:flex-start; }
  .side { width:280px; flex-shrink:0; background:#fff; border:1px solid var(--r); border-radius:12px; padding:10px; position:sticky; top:64px; max-height:calc(100vh - 84px); overflow:auto; }
  .side input { width:100%; border:1px solid var(--r); border-radius:8px; padding:6px 10px; margin-bottom:8px; font-size:13px; }
  .grp { margin:2px 0 4px; font-size:11px; font-weight:800; color:var(--m); letter-spacing:.05em; padding:8px 6px 2px; }
  .it { display:block; width:100%; text-align:left; background:none; border:none; border-radius:7px; padding:5px 8px;
    font-size:12.5px; cursor:pointer; color:var(--t); }
  .it small { display:block; color:var(--m); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .it.on { background:#e8f0fc; color:var(--a); }
  .main { flex:1; background:#fff; border:1px solid var(--r); border-radius:12px; padding:16px; min-width:0; }
  .main h2 { font-size:14px; margin:0 0 2px; }
  .main .hint { color:var(--m); font-size:12px; margin:0 0 10px; word-break:break-all; }
  .lbl { font-size:12px; font-weight:700; margin:10px 0 4px; display:flex; justify-content:space-between; }
  textarea { width:100%; min-height:110px; border:1px solid var(--r); border-radius:8px; padding:8px 10px; font:13px/1.5 ui-monospace,Menlo,monospace; resize:vertical; }
  textarea.zh { min-height:80px; font-family:-apple-system,"PingFang SC",sans-serif; }
  .actions { display:flex; gap:8px; margin-top:12px; align-items:center; }
  #msg { font-size:12px; color:#16a34a; margin-left:auto; }
  .preview-note { font-size:12px; color:var(--m); margin-top:8px; }
  .chips { margin:6px 0; }
  .chip { display:inline-block; font-size:11px; background:#eef3fb; color:var(--a); border-radius:999px; padding:1px 8px; margin-right:6px; }
</style>
</head>
<body>
<div class="top">
  <h1>📝 个人主页编辑台</h1>
  <span class="status" id="status">…</span>
  <button class="btn gray" id="visual">✎ 可视化编辑</button>
  <button class="btn gray" id="preview">预览当前页</button>
  <button class="btn primary" id="publish">🚀 保存并发布到 GitHub</button>
</div>
<div class="layout">
  <aside class="side">
    <input id="search" placeholder="搜索条目…">
    <div id="list"></div>
  </aside>
  <main class="main">
    <div id="empty" style="color:var(--m)">← 从左侧选择一个条目开始编辑</div>
    <div id="form" hidden>
      <h2 id="keyName"></h2>
      <p class="hint" id="curHint"></p>
      <div class="lbl"><span>English</span><span class="chip">支持 &lt;b&gt;/&lt;em&gt;/&lt;a&gt; 等少量标签</span></div>
      <textarea id="enBox" spellcheck="false"></textarea>
      <div class="lbl"><span>中文</span></div>
      <textarea id="zhBox" class="zh"></textarea>
      <div class="actions">
        <button class="btn primary" id="save">💾 保存该条（自动重建）</button>
        <span id="msg"></span>
      </div>
      <p class="preview-note">保存后会自动用 content.json 重新生成 index.html 与中文词典；
        发布按钮会把全部改动 commit+push，约 1 分钟后线上生效。</p>
    </div>
  </main>
</div>
<script>
  let DATA = null, cur = null;
  const $ = id => document.getElementById(id);

  async function api(path, opt) {
    const r = await fetch(path, opt); const d = await r.json(); if (!r.ok) throw new Error(d.error || 'err');
    return d;
  }
  async function refresh() {
    const s = await api('/api/status');
    $('status').textContent = s.dirty > 0 ? `未发布改动 ${s.dirty} 项 · 最近: ${s.last}` : `已全部发布 · 最近: ${s.last}`;
  }
  async function load() {
    DATA = await api('/api/content');
    renderList();
    refresh();
  }
  function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
  function renderList(filter) {
    const el = $('list'); el.innerHTML = '';
    const q = (filter || '').toLowerCase();
    let lastG = '';
    for (const it of DATA.list) {
      if (q && !(it.key + it.hint).toLowerCase().includes(q)) continue;
      if (it.group !== lastG) { lastG = it.group; el.insertAdjacentHTML('beforeend', `<div class="grp">${esc(lastG)}</div>`); }
      const b = document.createElement('button');
      b.className = 'it' + (cur === it.key ? ' on' : '');
      b.innerHTML = `<span>${esc(it.key)}</span><small>${esc(it.hint)}</small>`;
      b.onclick = () => open(it.key);
      el.appendChild(b);
    }
  }
  function open(key) {
    cur = key;
    const it = DATA.list.find(x => x.key === key);
    $('form').hidden = false; $('empty').hidden = true;
    $('keyName').textContent = key;
    $('curHint').textContent = it.en ? (it.en.replace(/<[^>]*>/g,' ').trim().slice(0,80)) : '';
    $('enBox').value = it.en;
    $('zhBox').value = it.zh;
    renderList($('search').value);
  }
  $('search').addEventListener('input', e => renderList(e.target.value));
  $('save').onclick = async () => {
    try {
      await api('/api/save', { method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ key: cur, en: $('enBox').value, zh: $('zhBox').value }) });
      $('msg').textContent = '已保存并重建 ✓';
      await load(); open(cur);
      setTimeout(() => $('msg').textContent = '', 2000);
    } catch (e) { $('msg').textContent = '失败: ' + e.message; }
  };
  $('publish').onclick = async () => {
    if (!confirm('发布全部改动到 GitHub（线上约 1 分钟生效）？')) return;
    $('msg').textContent = '发布中…';
    const r = await fetch('/api/publish', { method:'POST' }); const d = await r.json();
    $('msg').textContent = d.ok ? `已发布 ✓ ${d.commit || ''}` : '失败: ' + (d.error||'');
    refresh();
  };
  $('visual').onclick = () => window.open('/site', '_blank');
  $('preview').onclick = () => window.open('../index.html', '_blank');
  load();
</script>
</body>
</html>
